# Backoffice — Pages CMS (pagescms.org)
#
# Deliberadamente pequeno: dois ecrãs, oito campos. O que se faz aqui é mudar a ORDEM
# dos cartões e ESCONDER os que não se querem mostrar. Tudo o resto — nomes, endereços,
# cores, capturas, concelhos — vive em data/trabalhos.json, que este ficheiro NÃO
# declara e por isso o backoffice nunca vê nem pode estragar.
#
# Isso é importante: o Pages CMS reescreve o ficheiro inteiro ao gravar e APAGA as
# chaves que não estejam declaradas aqui. Enquanto o data/trabalhos.json ficar de fora
# do backoffice, está a salvo.
#
# Ao gravar: o Pages CMS faz commit em main → o GitHub Actions corre o gerador, escreve
# o index.html de volta e publica. Um a três minutos.
#
# Ao editar localmente, correr primeiro `git fetch && git rebase origin/main` — o CMS
# também faz commit em main.
#
# Porque é que os cartões estão num campo chamado «cartoes» dentro do ficheiro, em vez
# de o ficheiro ser ele próprio a lista (`list: true` ao nível da entrada): porque com
# `list: true` o Pages CMS fabrica um invólucro interno com `list: true` fixo no código
# (components/entry/entry.tsx) e o rótulo de cada linha só sai de `list.collapsible.summary`
# quando `list` é um OBJECTO (components/entry/entry-form.tsx). Nessa forma as 18 linhas
# diziam «Item #1» … «Item #18». Assim dizem «1. AMMA Creative».
#
# Verificado com o próprio esquema Zod do Pages CMS 2.1.8 — ver _source/pipeline/7-pages-yml.mjs.

media:
  input: assets
  output: assets

content:
  - name: cartoes
    label: Cartões
    path: data/vitrine.json
    type: file
    format: json
    description: >-
      A ORDEM DESTA LISTA É A ORDEM DA PÁGINA. Arrasta os itens pelo puxador à
      esquerda para mudar. Desliga o «Mostrar» para esconder um cartão — os
      contadores do topo, as contagens dos sectores e os concelhos do mapa
      actualizam-se sozinhos.
    fields:
      - name: cartoes
        label: false
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{index}. {nome}'
        fields:
          - name: mostrar
            label: Mostrar
            type: boolean
            default: true
          - name: nome
            label: Cartão
            type: string
            description: >-
              É o que aparece no título desta linha. O nome que aparece no site vem dos
              dados e é reposto aqui a cada publicação — mudá-lo aqui não muda o site.
          - name: id
            label: Identificador
            type: string
            required: true
            pattern: '^[a-z0-9-]+$'
            description: Não mexer. É o que liga esta linha aos dados do trabalho.

  - name: contactos
    label: Contactos
    path: data/autor.json
    type: file
    format: json
    description: >-
      O telemóvel aparece em quatro sítios da página e sai sempre daqui. Deixar um
      campo vazio faz o botão correspondente desaparecer — nada é inventado.
    fields:
      - name: telefone_display
        label: Telemóvel como aparece escrito
        type: string
        description: 'Exemplo: 925 110 570'
      - name: telefone
        label: Telemóvel para marcar
        type: string
        description: 'Com indicativo e +. Exemplo: +351925110570'
      - name: whatsapp
        label: WhatsApp
        type: string
        description: 'Indicativo sem o +. Exemplo: 351925110570'
      - name: email
        label: Email
        type: string
        description: Vazio para não aparecer em sítio nenhum.
      - name: nome
        label: Nome
        type: string
