name: Construir e publicar

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write      # para escrever de volta o index.html reconstruído
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # O build é a autoridade: se os dados estiverem mal (contagens que não somam,
      # uma cor de marca sem 4,5:1, um concelho que não existe na CAOP, um contacto
      # que não vem de autor.json), falha aqui e nada é publicado.
      - name: Gerar o index.html e o mapa
        run: node _source/build.mjs

      # O backoffice (Pages CMS) só mexe em data/*.json. É aqui que o index.html
      # gerado volta ao repositório — sem isto, editar no backoffice não mudava nada
      # na página. O [skip ci] impede que este commit dispare outra corrida.
      - name: Escrever de volta o index.html, se mudou
        run: |
          if git diff --quiet -- index.html assets/mapa.svg; then
            echo "index.html já estava actualizado."
          else
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html assets/mapa.svg
            git commit -m "Reconstruir a página a partir dos dados [skip ci]"
            git push
            echo "index.html reconstruído e empurrado."
          fi

      - name: Todas as ligações externas têm de responder
        run: |
          falhou=0
          # o canonical aponta para esta própria página: no primeiro deploy ainda não
          # existe, por isso fica de fora da verificação
          proprio=$(grep -oE 'rel="canonical" href="[^"]+"' index.html \
                    | sed 's/.*href="//; s/"$//')
          urls=$(grep -oE 'href="https://[^"]+"' index.html \
                 | sed 's/href="//; s/"$//' | sort -u \
                 | grep -Fxv "$proprio" | grep -v '^https://wa\.me/' || true)
          for u in $urls; do
            estado=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 \
                     --retry 2 -A 'Mozilla/5.0 (compatible; portfolio-ci)' "$u" || echo 000)
            if [ "$estado" != "200" ]; then
              echo "::error::$u devolveu $estado"
              falhou=1
            else
              echo "ok   $estado  $u"
            fi
          done
          exit $falhou

      - name: Nenhum ficheiro do sítio pode faltar
        run: |
          falhou=0
          for f in $(grep -oE '(src|href)="(assets|data)/[^"]+"' index.html \
                     | sed 's/.*="//; s/"$//' | sort -u); do
            [ -f "$f" ] || { echo "::error::falta $f"; falhou=1; }
          done
          exit $falhou

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
